<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Mudhakkirat Store{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Georgia', serif;
            background-color: #faf7f0;
            color: #2c2c2c;
            line-height: 1.6;
        }
        header {
            background-color: #2e5339;
            color: #f5e9c9;
            padding: 20px 30px;
            text-align: center;
        }
        header h1 {
            font-size: 28px;
            letter-spacing: 1px;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .card {
            background: #fff;
            border: 1px solid #e0dcd0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .card h3 {
            color: #2e5339;
            margin-bottom: 8px;
        }
        .card p {
            margin: 4px 0;
            color: #555;
        }
        .price {
            font-weight: bold;
            color: #a8762b;
            font-size: 18px;
        }
        a.button, button {
            display: inline-block;
            background-color: #2e5339;
            color: #fff;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }
        a.button:hover, button:hover {
            background-color: #244229;
        }
        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            color: #2e5339;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-top: 4px;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Mudhakkirat Store</h1>
    </header>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        &copy; Mudhakkirat Store
    </footer>
</body>
</html>
